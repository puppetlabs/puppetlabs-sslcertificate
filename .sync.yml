---
".gitlab-ci.yml":
  delete: true
appveyor.yml:
  delete: true
rubocop.yml:
  include_todos: true


spec/spec_helper.rb:
  mock_with: ":rspec"
  coverage_report: true
  spec_overrides:
  - def regexp_matches(available_parameters)
  - "  match(available_parameters)"
  - end
.gitpod.Dockerfile:
  unmanaged: false
.gitpod.yml:
  unmanaged: false
.github/workflows/auto_release.yml:
  unmanaged: false
.github/workflows/ci.yml:
  unmanaged: true
.github/workflows/nightly.yml:
  unmanaged: true
  cron: '35 0 * * *'
.github/workflows/release.yml:
  unmanaged: false
.travis.yml:
  delete: true
.rubocop.yml:
  # the module has a .rubocop_todo.yml (MODULES-11997 pdk update)
  include_todos: true
Rakefile:
  # puppet-lint checks the module disabled by hand (Rakefile/.puppet-lint.rc) (MODULES-11997 pdk update)
  extra_disabled_lint_checks:
  - strict_indent
